<!-- @dsCard group="Colors" viewport="700x160" name="Base Surfaces" subtitle="bg / surface / surface-alt / border" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:160px;font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted)">
<div style="flex:1;background:var(--color-bg);display:flex;align-items:flex-end;padding:10px">bg #0B211F</div>
<div style="flex:1;background:var(--color-surface);display:flex;align-items:flex-end;padding:10px">surface #123330</div>
<div style="flex:1;background:var(--color-surface-raised);display:flex;align-items:flex-end;padding:10px">surface-raised #1A3F38</div>
<div style="flex:1;background:var(--color-bg-deep);display:flex;align-items:flex-end;padding:10px">bg-deep #061613</div>
<div style="flex:1;background:var(--color-bg);border:1px solid var(--color-border);display:flex;align-items:flex-end;padding:10px">border #2A4A43</div>
</div>
