<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js"></script>
<div id="root" style="background:var(--color-bg);padding:24px;"></div>
<script type="text/babel">
const { Card, Modal, Button } = window.LeadPilotDesignSystem_8c9681;
function Demo(){
  const [open, setOpen] = React.useState(false);
  return <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
    <div style={{display:'flex',gap:'16px'}}>
      <Card style={{width:'200px'}}>
        <div style={{color:'var(--color-text-muted)',fontSize:'13px'}}>Open pipeline</div>
        <div style={{color:'var(--color-text)',fontFamily:'var(--font-display)',fontSize:'28px',fontWeight:600}}>128</div>
      </Card>
      <Card featured style={{width:'200px'}}>
        <div style={{color:'var(--color-primary)',fontSize:'13px'}}>Featured</div>
        <div style={{color:'var(--color-text)',fontFamily:'var(--font-display)',fontSize:'28px',fontWeight:600}}>New</div>
      </Card>
    </div>
    <Button variant="secondary" onClick={() => setOpen(true)}>Open modal</Button>
    <Modal open={open} onClose={() => setOpen(false)} title="Delete lead?"
      footer={<>
        <Button variant="secondary" onClick={() => setOpen(false)}>Cancel</Button>
        <Button variant="accent" onClick={() => setOpen(false)}>Delete</Button>
      </>}>
      This can't be undone.
    </Modal>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
