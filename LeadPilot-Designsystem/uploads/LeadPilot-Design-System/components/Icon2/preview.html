<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js"></script>
<div id="root" style="background:var(--color-bg);padding:20px;"></div>
<script type="text/babel">
const { Icon, ICON_NAMES } = window.LeadPilotDesignSystem_8c9681;
function Grid(){
  return <div style={{display:'grid',gridTemplateColumns:'repeat(9,1fr)',gap:'14px'}}>
    {ICON_NAMES.map(n => (
      <div key={n} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px',color:'var(--color-text-muted)'}}>
        <Icon name={n} size={20} color="var(--color-primary)" />
        <span style={{fontFamily:'var(--font-mono)',fontSize:'9px'}}>{n}</span>
      </div>
    ))}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Grid />);
</script>
