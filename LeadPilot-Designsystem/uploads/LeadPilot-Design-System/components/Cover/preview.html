Pattern: soft node field (48 discs, pitch 24 = space-5, r 4) cut out of the primary block - the network node of the logo mark; chosen over stripes/rules because the brand is round, dark and network-themed.
Steps and radii: gaps 8 = space-2, corners radius-lg 20, insets 32 = space-6, discs half the short side. -->
