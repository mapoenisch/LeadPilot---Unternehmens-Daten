<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LeadPilot — Dashboard</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components/bundle.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../components/bundle.js"></script>
<meta name="ext-resource-dependency" content="../../assets/logo/leadpilot-logo-full.png" data-resource-id="logoFull" />
<style>body{margin:0}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./Sidebar.jsx"></script>
<script type="text/babel" src="./OverviewView.jsx"></script>
<script type="text/babel" src="./LeadsView.jsx"></script>
<script type="text/babel" src="./SequencesView.jsx"></script>
<script type="text/babel" src="./SettingsView.jsx"></script>
<script type="text/babel">
const DS = window.LeadPilotDesignSystem_8c9681;
const { NavItem, Icon, Badge, Card, SectionHeader, Table, Button, Tabs, Modal, Input, Divider } = DS;

function App(){
  const [view, setView] = React.useState('overview');
  return (
    <div style={{display:'flex',minHeight:'100vh',background:'var(--color-bg)',fontFamily:'var(--font-body)'}}>
      <Sidebar active={view} onSelect={setView} NavItem={NavItem} Icon={Icon} Badge={Badge} />
      <main style={{flex:1,padding:'var(--space-6) var(--space-8)',overflow:'auto'}}>
        {view === 'overview' && <OverviewView Card={Card} SectionHeader={SectionHeader} Table={Table} Badge={Badge} Button={Button} />}
        {view === 'leads' && <LeadsView SectionHeader={SectionHeader} Tabs={Tabs} Table={Table} Badge={Badge} Button={Button} Modal={Modal} Input={Input} />}
        {view === 'sequences' && <SequencesView SectionHeader={SectionHeader} Card={Card} Badge={Badge} Button={Button} Icon={Icon} />}
        {view === 'settings' && <SettingsView SectionHeader={SectionHeader} Input={Input} Button={Button} Divider={Divider} />}
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</template>
</body>
</html>
