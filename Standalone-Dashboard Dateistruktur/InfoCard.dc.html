<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/leadpilot-designsystem-8c96812c-8272-4169-ac82-5e0f9b2372ce/tokens/colors.css">
  <link rel="stylesheet" href="_ds/leadpilot-designsystem-8c96812c-8272-4169-ac82-5e0f9b2372ce/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/leadpilot-designsystem-8c96812c-8272-4169-ac82-5e0f9b2372ce/tokens/typography.css">
  <link rel="stylesheet" href="_ds/leadpilot-designsystem-8c96812c-8272-4169-ac82-5e0f9b2372ce/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/leadpilot-designsystem-8c96812c-8272-4169-ac82-5e0f9b2372ce/tokens/radius.css">
  <link rel="stylesheet" href="_ds/leadpilot-designsystem-8c96812c-8272-4169-ac82-5e0f9b2372ce/tokens/shadows.css">
  <link rel="stylesheet" href="_ds/leadpilot-designsystem-8c96812c-8272-4169-ac82-5e0f9b2372ce/styles.css">
  <script src="_ds/leadpilot-designsystem-8c96812c-8272-4169-ac82-5e0f9b2372ce/_ds_bundle.js"></script>
</helmet>
<x-import component-from-global-scope="LeadPilotDesignSystem_8c9681.Card" featured="{{ highlight }}" style="height:100%;box-sizing:border-box" hint-size="100%,180px">
  <div style="display:flex;flex-direction:column;gap:10px;font-family:var(--font-body)">
    <sc-if value="{{ hasTitle }}">
      <div style="font-family:var(--font-display);font-size:var(--text-h3);font-weight:var(--weight-semibold);color:var(--color-text)">{{ title }}</div>
    </sc-if>
    <sc-if value="{{ hasSubtitle }}">
      <div style="color:var(--color-text-muted);font-size:var(--text-small)">{{ subtitle }}</div>
    </sc-if>
    <sc-if value="{{ hasParagraphs }}">
      <div style="display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{ paragraphs }}" as="p" hint-placeholder-count="2">
          <p style="margin:0;color:var(--color-text-muted);font-size:var(--text-small);line-height:var(--leading-open)">{{ p }}</p>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ hasItems }}">
      <ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
          <li style="color:var(--color-text-muted);font-size:var(--text-small);line-height:var(--leading-normal)">{{ it }}</li>
        </sc-for>
      </ul>
    </sc-if>
    <sc-if value="{{ hasFootnote }}">
      <div style="color:var(--color-text-muted);font-size:var(--text-tiny);border-top:1px solid var(--color-border-soft);padding-top:8px">{{ footnote }}</div>
    </sc-if>
  </div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:220}}">
class Component extends DCLogic {
  renderVals() {
    return {
      title: this.props.title ?? '',
      hasTitle: !!this.props.title,
      subtitle: this.props.subtitle ?? '',
      hasSubtitle: !!this.props.subtitle,
      paragraphs: this.props.paragraphs ?? [],
      hasParagraphs: !!(this.props.paragraphs && this.props.paragraphs.length),
      items: this.props.items ?? [],
      hasItems: !!(this.props.items && this.props.items.length),
      footnote: this.props.footnote ?? '',
      hasFootnote: !!this.props.footnote,
      highlight: !!this.props.highlight,
    };
  }
}
</script>
</body>
</html>
