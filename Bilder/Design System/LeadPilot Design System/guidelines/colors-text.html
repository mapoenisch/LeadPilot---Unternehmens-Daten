<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:160px;font-family:var(--font-mono);font-size:11px">
<div style="flex:1;background:var(--color-bg);color:var(--color-text);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px"><span style="font-size:20px;font-family:var(--font-display)">Aa</span>text #FFFFFF</div>

<div style="flex:1;background:var(--color-text);color:var(--color-text-inverse);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px"><span style="font-size:20px;font-family:var(--font-display)">Aa</span>text-inverse #14161A</div>
