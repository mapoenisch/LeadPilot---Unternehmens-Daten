<!-- @dsCard group="Colors" viewport="700x160" name="Semantic Status" subtitle="success / warning / error — error is a dedicated red, never orange" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:160px;font-family:var(--font-mono);font-size:11px;color:var(--color-text-inverse)">
<div style="flex:1;background:var(--color-success);display:flex;align-items:flex-end;padding:10px">success #3DDC97</div>
<div style="flex:1;background:var(--color-warning);display:flex;align-items:flex-end;padding:10px">warning #FF7A3D</div>
<div style="flex:1;background:var(--color-error);display:flex;align-items:flex-end;padding:10px">error #FF5A5F</div>
</div>
