<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="background:var(--color-bg);padding:24px;"></div>
<script type="text/babel">
const { Table, Badge } = window.LeadPilotDesignSystem_8c9681;
function Demo(){
  const columns = [
    {key:'name',label:'Name'},
    {key:'company',label:'Company'},
    {key:'status',label:'Status', render:r => <Badge variant={r.status==='Won'?'cyan':r.status==='Hot'?'orange':'neutral'}>{r.status}</Badge>},
  ];
  const rows = [
    {name:'Ari Chen', company:'Northwind', status:'Hot'},
    {name:'Priya Rao', company:'Fenwick Co', status:'Won'},
    {name:'Sam Okafor', company:'Delta Labs', status:'New'},
  ];
  return <Table columns={columns} rows={rows} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
