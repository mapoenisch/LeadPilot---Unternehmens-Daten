<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="background:var(--color-bg);padding:24px;"></div>
<script type="text/babel">
const { Badge, Alert } = window.LeadPilotDesignSystem_8c9681;
function Demo(){
  return <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
    <div style={{display:'flex',gap:'10px'}}>
      <Badge variant="cyan">New</Badge>
      <Badge variant="orange">Hot lead</Badge>
      <Badge variant="neutral">Draft</Badge>
    </div>
    <Alert variant="info" title="Sync in progress">Fetching new leads from your CRM.</Alert>
    <Alert variant="success" title="Lead imported">42 contacts added to your pipeline.</Alert>
    <Alert variant="warning" title="Quota near limit">You've used 90% of this month's sends.</Alert>
    <Alert variant="error" title="Sync failed" onDismiss={() => {}}>Check your CRM connection.</Alert>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
